# Temporary: runs scripts in scripts/live/ on a GitHub runner (open internet) during the M7 build.
name: live-check
on:
  push:
    branches: [claude/relaxed-goldberg-svwx2h]
    paths: ["scripts/live/**", ".github/workflows/live-check.yml"]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: python scripts/live/run.py
