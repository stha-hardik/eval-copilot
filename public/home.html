<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My projects · Eval Co-pilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <div class="page-head enter">
      <div>
        <span class="eyebrow"><span class="dot" aria-hidden="true"></span>Your websites</span>
        <h1>My projects</h1>
        <p>Each site you test, with its latest run.</p>
      </div>
      <div class="head-actions">
        <span class="chip" id="site-count" hidden><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span id="site-count-text"></span></span>
        <button class="btn btn-primary" id="new-site" type="button"><i data-lucide="plus" aria-hidden="true"></i>New project</button>
      </div>
    </div>

    <div id="content" aria-live="polite"></div>
  </main>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
